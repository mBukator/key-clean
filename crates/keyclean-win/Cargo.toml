[package]
name = "keyclean-win"
description = "All Win32 and all unsafe code for KeyClean."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
keyclean-core = { path = "../keyclean-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[features]
# Test kit for the automated end-to-end harness (crates/keyclean-e2e, ADR 0008). Never enabled by
# the app. Adds the Win32 APIs only the harness needs.
testkit = [
    "windows/Win32_System_Shutdown",
    "windows/Win32_UI_HiDpi",
]

[lints]
workspace = true
